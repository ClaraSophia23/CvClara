<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currículo - Clara Sophia</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="curriculo">

        <header>
            <div class="header-info">
                <h1 id="nome"></h1>
                <h3 id="titulo"></h3>
                <div id="contato"></div>
            </div>
            <img id="foto" src="" alt="">
        </header>

        <section>
            <h2>Objetivo Profissional</h2>
            <p id="objetivo"></p>
        </section>

        <section>
            <h2>Resumo Profissional</h2>
            <p id="resumo"></p>
        </section>

        <section>
            <h2>Formação Acadêmica</h2>
            <div id="formacao"></div>
        </section>

        <section>
            <h2>Projetos Acadêmicos</h2>
            <div id="projetos"></div>
        </section>

        <section>
            <h2>Conhecimentos Técnicos</h2>
            <ul id="conhecimentos"></ul>
        </section>

        <section>
            <h2>Ferramentas</h2>
            <ul id="ferramentas"></ul>
        </section>

        <section>
            <h2>Competências Comportamentais</h2>
            <ul id="competencias"></ul>
        </section>

        <section>
            <h2>Idiomas</h2>
            <div id="idiomas"></div>
        </section>

        <section>
            <h2>Cursos Complementares</h2>
            <div id="cursos"></div>
        </section>

        <section>
            <h2>Preferências Profissionais</h2>
            <div id="preferencias"></div>
        </section>

    </main>

</body>
</html>
